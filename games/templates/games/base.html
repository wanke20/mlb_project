<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MLB Predictions{% endblock %}</title>
    <style>
        :root {
            --bg:            #0d1117;
            --surface:       #161b22;
            --surface-hover: #1c2128;
            --border:        #30363d;
            --header-bg:     #010409;
            --text:          #e6edf3;
            --text-muted:    #8b949e;
            --accent:        #58a6ff;
            --accent-hover:  #79b8ff;
            --green:         #3fb950;
            --red:           #f85149;
            --orange:        #d29922;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ---- Nav ---- */
        nav {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            display: flex;
            align-items: center;
            height: 52px;
            gap: 28px;
        }

        nav .brand {
            font-weight: bold;
            font-size: 15px;
            color: var(--text);
            text-decoration: none;
            margin-right: 12px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: var(--text);
        }

        /* ---- Page wrapper ---- */
        .page {
            padding: 40px;
            max-width: 1300px;
            margin: 0 auto;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 17px;
            margin: 28px 0 12px;
            color: var(--text-muted);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 28px;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        ul {
            padding-left: 20px;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 2;
        }

        code {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 12px;
            color: var(--text);
        }

        /* ---- Cards (game list) ---- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            text-decoration: none;
            color: var(--text);
            display: block;
            transition: border-color 0.15s, background 0.15s;
        }

        .card:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
            text-decoration: none;
            color: var(--text);
        }

        .card .team {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .card .meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ---- Tables ---- */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            font-size: 14px;
        }

        thead {
            background: var(--header-bg);
        }

        th {
            padding: 12px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            user-select: none;
        }

        th.sortable {
            cursor: pointer;
        }

        th.sortable:hover {
            color: var(--text);
        }

        th.sort-asc::after  { content: " ▲"; font-size: 10px; color: var(--accent); }
        th.sort-desc::after { content: " ▼"; font-size: 10px; color: var(--accent); }

        td {
            padding: 11px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover td {
            background: var(--surface-hover);
        }

        /* ---- Streak / status badges ---- */
        .streak-win  { color: var(--green); font-weight: bold; }
        .streak-loss { color: var(--red);   font-weight: bold; }
        .hot         { color: var(--orange); font-weight: bold; }
        .na          { color: var(--text-muted); font-style: italic; }

        /* ---- Charts ---- */
        .chart-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .chart-block img {
            display: block;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>

{% load tz %}
<nav>
    <a class="brand" href="{% url 'home_page' %}">⚾ MLB Predictions</a>
    <a href="{% url 'game_list' %}">Games</a>
    <a href="{% url 'trends' %}">Trends</a>
</nav>

<div class="page">
    {% block content %}{% endblock %}
</div>

</body>
</html>
